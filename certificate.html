<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado Oficial - Ajuste de Logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --gold: #d4af37;
            --dark: #1a1a1a;
            --red: #c0392b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Libre Baskerville', serif;
        }

        /* Container Principal */
        #certificate-container {
            width: 1120px;
            height: 790px;
            background: white;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* SVG de Fundo (Diagonais) */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Molduras */
        .outer-border {
            border: 15px solid var(--dark);
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            padding: 15px;
            display: flex;
        }

        .inner-border {
            border: 2px solid var(--gold);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 60px;
            position: relative;
        }

        /* Cabeçalho e Logos - CORREÇÃO DO ASPECT RATIO */
        .header-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            z-index: 20;
        }

        .logo-box { 
            text-align: center; 
            width: 150px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img { 
            width: 100px; /* Largura fixa */
            height: auto;  /* Altura automática para manter a proporção original */
            max-height: 100px; /* Garante que não fique gigante */
            display: block;
        }
        
        .logo-text { 
            font-size: 11px; 
            font-weight: bold; 
            color: white; 
            text-transform: uppercase;
            margin-top: 8px;
            width: 120%; /* Permite que o texto respire um pouco */
        }

        /* Conteúdo de Texto */
        .title {
            font-family: 'Cinzel', serif;
            font-size: 72px;
            color: var(--dark);
            margin-top: 10px;
            border-bottom: 3px solid var(--gold);
            padding: 0 40px;
        }

        .subtitle {
            text-transform: uppercase;
            letter-spacing: 10px;
            font-size: 22px;
            margin: 15px 0 35px 0;
        }

        .name {
            font-family: 'Great Vibes', cursive;
            font-size: 90px;
            color: var(--dark);
            margin: 10px 0;
        }

        .event-text {
            font-size: 20px;
            text-align: center;
            max-width: 800px;
            line-height: 1.6;
        }

        .verse {
            font-size: 15px;
            font-style: italic;
            color: #444;
            margin-top: 20px;
            text-align: center;
        }

        /* Assinaturas */
        .footer-signatures {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto; 
            padding-bottom: 40px;
        }

        .sig-block { width: 300px; text-align: center; }
        .sig-line { border-top: 2px solid var(--dark); margin-bottom: 8px; }
        .sig-name { font-size: 17px; font-weight: bold; }
        .sig-role { font-size: 13px; }

        /* Botão */
        .btn-download {
            margin-top: 25px;
            padding: 15px 40px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="certificate-container">
        <svg class="bg-shapes" viewBox="0 0 1120 790" preserveAspectRatio="none">
            <polygon points="0,0 350,0 120,790 0,790" fill="#c0392b" />
            <polygon points="0,0 280,0 100,790 0,790" fill="#1a1a1a" />
            <polygon points="1120,350 1120,790 850,790" fill="#c0392b" />
        </svg>

        <div class="outer-border">
            <div class="inner-border">
                
                <header class="header-logos">
                    <div class="logo-box">
                        <img src="image/logo-ad.png" class="logo-img" alt="Logo AD">
                        <span class="logo-text">AD CACHOEIRINHA</span>
                    </div>
                    <div class="logo-box">
                        <img src="image/logo-comadepd.png" class="logo-img" alt="Logo COMADEP">
                    </div>
                </header>

                <h1 class="title">CERTIFICADO</h1>
                <p class="subtitle">PARTICIPAÇÃO</p>

                <p style="font-size: 22px; font-style: italic;">Certifico que</p>
                <h2 class="name" id="userName">Nome do Participante</h2>

                <p class="event-text">
                    participou com êxito do <strong>1º Seminário de Educação Cristã</strong> realizado pela Assembleia de Deus em Cachoeirinha-PB.
                </p>

                <div class="verse" id="userVerse"></div>

                <div class="footer-signatures">
                    <div class="sig-block">
                        <div class="sig-line"></div>
                        <p class="sig-name">Pastor Elinaldo Renovato</p>
                        <p class="sig-role">Ministrante</p>
                    </div>

                    <div class="sig-block" style="font-size: 14px;">
                        Cachoeirinha - PB, <span id="currentDate"></span>
                    </div>

                    <div class="sig-block">
                        <div class="sig-line"></div>
                        <p class="sig-name">Pastor João Venâncio</p>
                        <p class="sig-role">Pastor Local</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-download" onclick="downloadPNG()">📥 BAIXAR CERTIFICADO EM PNG</button>

    <script>
        const verses = [
            { t: "Lâmpada para os meus pés é tua palavra, e luz para o meu caminho.", r: "Salmos 119:105" },
            { t: "Procura apresentar-te a Deus aprovado, como obreiro que não tem de que se envergonhar.", r: "2 Timóteo 2:15" }
        ];

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('userName').innerText = params.get('name') || 'Visitante';
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
            const v = verses[Math.floor(Math.random() * verses.length)];
            document.getElementById('userVerse').innerHTML = `"${v.t}" <br><strong>${v.r}</strong>`;
        };

        function downloadPNG() {
            const container = document.getElementById('certificate-container');
            
            // Forçamos o navegador a garantir que as imagens estão prontas
            html2canvas(container, {
                scale: 2, // Melhora a qualidade
                useCORS: true, 
                backgroundColor: "#ffffff",
                imageTimeout: 0 // Evita que imagens demorem e fiquem em branco
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Certificado_${document.getElementById('userName').innerText}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
