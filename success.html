<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Confirmada - Festividade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.8s ease-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .bible-verse {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin: 30px 0;
            font-style: italic;
            line-height: 1.6;
        }

        .verse-text {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .verse-reference {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 10px;
        }

        .peace-message {
            font-size: 20px;
            color: #764ba2;
            margin-top: 30px;
            font-weight: bold;
        }

        .button-container {
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .info-text {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1>Inscrição Confirmada!</h1>
        <p class="subtitle">Sua inscrição foi enviada com sucesso para a Festividade da Assembleia de Deus Cachoeirinha.</p>

        <div class="bible-verse">
            <div class="verse-text" id="verseText"></div>
            <div class="verse-reference" id="verseReference"></div>
        </div>

        <div class="peace-message">
            🙏 A Paz do Senhor seja convosco! 🙏
        </div>

        <div class="button-container">
            <a href="index.html" class="btn">Voltar ao Início</a>
            <a href="#" id="certificateBtn" class="btn">📜 Gerar Certificado</a>
        </div>

        <p class="info-text">Em breve você receberá um email de confirmação com mais detalhes sobre o evento.</p>
    </div>

    <script>
        const verses = [
            {
                text: "Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.",
                reference: "João 3:16"
            },
            {
                text: "A graça do Senhor Jesus Cristo, e o amor de Deus, e a comunhão do Espírito Santo sejam com todos vós.",
                reference: "2 Coríntios 13:14"
            },
            {
                text: "Portanto, se alguém está em Cristo, é nova criação. As coisas antigas já se foram; eis que surgiram coisas novas!",
                reference: "2 Coríntios 5:17"
            },
            {
                text: "Porque somos feitura de Deus, criados em Cristo Jesus para as boas obras, as quais Deus de antemão preparou para que andássemos nelas.",
                reference: "Efésios 2:10"
            },
            {
                text: "Alegra-te sempre no Senhor; outra vez digo, alegra-te. A vossa moderação seja conhecida de todos os homens. Perto está o Senhor.",
                reference: "Filipenses 4:4-5"
            },
            {
                text: "Porque o Senhor é bom; a sua misericórdia dura para sempre, e a sua fidelidade por todas as gerações.",
                reference: "Salmos 100:5"
            },
            {
                text: "Confiai no Senhor de todo o vosso coração e não vos estribes na vossa própria prudência. Reconhecei-o em todos os vossos caminhos, e ele endireitará as vossas veredas.",
                reference: "Provérbios 3:5-6"
            },
            {
                text: "Assim, pois, a fé vem pelo ouvir, e o ouvir pela palavra de Cristo.",
                reference: "Romanos 10:17"
            },
            {
                text: "Porque nada será impossível para Deus.",
                reference: "Lucas 1:37"
            },
            {
                text: "E a paz de Deus, que excede todo o entendimento, guardará o vosso coração e a vossa mente em Cristo Jesus.",
                reference: "Filipenses 4:7"
            }
        ];

        // Função para pegar um versículo aleatório
        function getRandomVerse() {
            return verses[Math.floor(Math.random() * verses.length)];
        }

        // Exibir versículo aleatório ao carregar
        window.addEventListener('load', function() {
            const randomVerse = getRandomVerse();
            document.getElementById('verseText').textContent = `"${randomVerse.text}"`;
            document.getElementById('verseReference').textContent = `- ${randomVerse.reference}`;

            // Pegar nome da URL e adicionar ao botão de certificado
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');

            if (name) {
                document.getElementById('certificateBtn').href = `certificate.html?name=${encodeURIComponent(name)}`;
            }
        });
    </script>
</body>
</html>
