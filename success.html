<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Confirmada - Festividade</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .success-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #2d3748; margin-bottom: 20px; }
        p { color: #4a5568; line-height: 1.6; margin-bottom: 30px; }

        .verse-container {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 30px 0;
            font-style: italic;
        }

        .home-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div style="font-size: 50px; margin-bottom: 20px;">🙏</div>
        <h1>Inscrição Confirmada!</h1>
        <p>A Paz do Senhor, <strong id="userName">Participante</strong>. Sua inscrição foi realizada com sucesso e o certificado foi enviado para o nosso sistema.</p>
        
        <div class="verse-container">
            <p id="verseText">"Carregando palavra de Deus..."</p>
            <small id="verseReference"></small>
        </div>

        <p>Não esqueça de enviar o comprovante do PIX via WhatsApp.</p>
        <a href="index.html" class="home-link">Voltar para a página inicial</a>
    </div>

    <script>
        const verses = [
            { text: "Lâmpada para os meus pés é tua palavra, e luz para o meu caminho.", reference: "Salmos 119:105" },
            { text: "Tudo posso naquele que me fortalece.", reference: "Filipenses 4:13" },
            { text: "O Senhor é o meu pastor, nada me faltará.", reference: "Salmos 23:1" },
            { text: "Procura apresentar-te a Deus aprovado, como obreiro que não tem de que se envergonhar.", reference: "2 Timóteo 2:15" }
        ];

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');
            if (name) document.getElementById('userName').innerText = name;

            const v = verses[Math.floor(Math.random() * verses.length)];
            document.getElementById('verseText').innerText = `"${v.text}"`;
            document.getElementById('verseReference').innerText = `- ${v.reference}`;
        };
    </script>
</body>
</html>
