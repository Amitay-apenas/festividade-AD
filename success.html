<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Confirmada - Festividade</title>
    <!-- Bibliotecas para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* ... mantenha todo o CSS igual ... */
    </style>
</head>
<body>
    <div class="success-container">
        <!-- ... conteúdo mantido igual ... -->
        <p id="statusMessage" class="info-text" style="color: #667eea; margin-top: 10px;"></p>
    </div>

    <!-- Elemento oculto para gerar o certificado -->
    <div id="certificate" style="display: none; width: 1120px; height: 790px; background: white; position: absolute; left: -9999px; top: -9999px;">
        <!-- ... conteúdo mantido igual ... -->
    </div>

    <script>
        const verses = [
            {
                text: "Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.",
                reference: "João 3:16"
            },
            // ... outros versículos mantidos iguais ...
        ];

        function getRandomVerse() {
            return verses[Math.floor(Math.random() * verses.length)];
        }

        async function generateAndSendCertificate(name, email) {
            try {
                document.getElementById('statusMessage').textContent = 'Gerando certificado...';

                // Atualizar dados no certificado
                document.getElementById('certName').textContent = name;
                document.getElementById('certDate').textContent = new Date().toLocaleDateString('pt-BR');

                // Aguardar um momento para garantir que o DOM foi atualizado
                await new Promise(resolve => setTimeout(resolve, 100));

                // Gerar PDF do certificado
                const certificateDiv = document.getElementById('certificate');
                
                // CORREÇÃO: Configurações do html2canvas para gerar imagem corretamente
                const canvas = await html2canvas(certificateDiv, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    allowTaint: true,
                    foreignObjectRendering: true
                });

                // Verificar se o canvas foi gerado corretamente
                if (!canvas) {
                    throw new Error('Falha ao gerar canvas');
                }

                // CORREÇÃO: Converter canvas para base64 corretamente
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                
                // Verificar se a string base64 é válida
                if (!imgData || !imgData.startsWith('data:image/')) {
                    throw new Error('Imagem não gerada corretamente');
                }

                // Criar PDF
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                // CORREÇÃO: Adicionar imagem com parâmetros corretos
                const imgWidth = 297; // A4 landscape width in mm
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);
                
                // Gerar blob
                const pdfBlob = pdf.output('blob');

                document.getElementById('statusMessage').textContent = 'Enviando certificado por email...';

                // Enviar para Web3Forms
                const formData = new FormData();
                formData.append('access_key', '83a31b9d-e40e-4193-9394-7d82fb068514');
                formData.append('subject', `Certificado de Participação - ${name}`);
                formData.append('from_name', 'Festividade Assembleia de Deus');
                formData.append('email', email || 'rodriguesamitay@gmail.com');
                formData.append('message', `Prezado(a) ${name},\n\nSeu certificado de participação no 1º Seminário de Educação Cristã está em anexo.\n\nA Paz do Senhor seja com você!\n\nAssembleia de Deus em Cachoeirinha-PB`);
                formData.append('certificate', pdfBlob, `Certificado_${name.replace(/\s+/g, '_')}.pdf`);

                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    document.getElementById('statusMessage').textContent = '✅ Certificado enviado com sucesso para o email registrado!';
                } else {
                    document.getElementById('statusMessage').textContent = '⚠️ Certificado gerado, mas com dificuldades no envio. Tente novamente.';
                }
            } catch (error) {
                console.error('Erro detalhado:', error);
                document.getElementById('statusMessage').textContent = '⚠️ Erro ao processar certificado: ' + error.message;
            }
        }

        window.addEventListener('load', function() {
            const randomVerse = getRandomVerse();
            document.getElementById('verseText').textContent = `"${randomVerse.text}"`;
            document.getElementById('verseReference').textContent = `- ${randomVerse.reference}`;

            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');
            const email = params.get('email');

            if (name) {
                // Verificar se o nome é válido
                if (name.trim() === '' || name === 'undefined') {
                    document.getElementById('statusMessage').textContent = '⚠️ Nome não reconhecido. Contate a organização.';
                    return;
                }
                
                // Gerar certificado apenas se tiver nome válido
                generateAndSendCertificate(name, email || '');
            } else {
                document.getElementById('statusMessage').textContent = '⚠️ Informações de inscrição não encontradas.';
            }
        });
    </script>
</body>
</html>
